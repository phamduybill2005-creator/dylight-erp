# ====================================================================
# TRIỂN KHAI SẢN XUẤT — chạy ERP sau Caddy (HTTPS tự động) trên 1 server.
#
# Hướng dẫn đầy đủ từng bước: xem docs/DEPLOY-VPS.md
#
# 1) Tạo file .env cạnh file này (xem các biến bên dưới), đổi HẾT mật khẩu/secret.
# 2) Trỏ DNS:  erp.dosco.vn  ->  IP server này (bản ghi A).
# 3) Chạy:     docker compose -f docker-compose.prod.yml up -d --build
# 4) CHỈ KHI DB TRỐNG HOÀN TOÀN mới nạp dữ liệu mẫu:
#              docker compose -f docker-compose.prod.yml exec backend python -m app.seed
#    CẢNH BÁO: app.seed tạo tài khoản demo mật khẩu 123456 (giamdoc@dosco.vn ...).
#    Chạy xong PHẢI đổi mật khẩu ngay. Đang dùng DB thật (Neon/đã có dữ liệu)
#    thì TUYỆT ĐỐI KHÔNG chạy lệnh này.
#
# Biến cần đặt trong .env (ví dụ):
#   DOMAIN=erp.dosco.vn
#   POSTGRES_PASSWORD=<mật khẩu mạnh>
#   SECRET_KEY=<chuỗi ngẫu nhiên dài>
#   ATTENDANCE_API_KEY=<key mạnh cho máy chấm công>
#   DATABASE_URL=<tùy chọn — đặt nếu dùng DB sẵn có, VD Neon; bỏ trống thì
#                 dùng Postgres chạy trong container db bên dưới>
# ====================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dylight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?dat POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: dylight
    volumes:
      - dylight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dylight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bỏ trống DATABASE_URL -> dùng Postgres trong container db.
      # Đặt DATABASE_URL trong .env -> trỏ thẳng sang DB sẵn có (VD Neon), giữ
      # nguyên dữ liệu đang chạy, không phải chuyển đổi gì.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://dylight:${POSTGRES_PASSWORD}@db:5432/dylight}
      SECRET_KEY: ${SECRET_KEY:?dat SECRET_KEY trong .env}
      FRONTEND_ORIGINS: https://${DOMAIN:-erp.dosco.vn}
      # PROD: tắt debug (bắt buộc SECRET_KEY thật) + TẮT tự nạp dữ liệu mẫu.
      # Mặc định trong config.py là True cho môi trường dev; để nguyên khi deploy
      # ra Internet là tự tạo tài khoản demo mật khẩu 123456 -> cửa hậu.
      DEBUG: "false"
      AUTO_SEED: "false"
      ATTENDANCE_API_KEY: ${ATTENDANCE_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      # Đồng bộ tự động chấm công Yunatt (mỗi ngày 20:00)
      YUNATT_ENABLED: ${YUNATT_ENABLED:-false}
      YUNATT_EMAIL: ${YUNATT_EMAIL:-}
      YUNATT_PASSWORD: ${YUNATT_PASSWORD:-}
      YUNATT_SYNC_HOUR: ${YUNATT_SYNC_HOUR:-20}
      YUNATT_COMPANY_ID: ${YUNATT_COMPANY_ID:-0}
    volumes:
      - dylight_uploads:/code/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # "Nướng" vào bundle lúc build -> trình duyệt gọi đúng domain thật.
        NEXT_PUBLIC_API_BASE: https://${DOMAIN:-erp.dosco.vn}/api/v1
        NEXT_PUBLIC_ASSET_BASE: https://${DOMAIN:-erp.dosco.vn}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      # Caddyfile đọc {$DOMAIN} -> đổi domain chỉ cần sửa .env.
      DOMAIN: ${DOMAIN:-erp.dosco.vn}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dylight_pgdata:
  dylight_uploads:
  caddy_data:
  caddy_config:
