# DYLIGHT ERP — cấu hình production trên VPS (https://erp.dosco.vn).
# Bí mật nằm trong các file env trên máy chủ, KHÔNG commit:
#   ./backend/.env, ./backend/yunatt.env, ./postgres.env
# Job đồng bộ chấm công Yunatt:
#   docker compose --profile jobs run --rm yunatt-sync

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: ./postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: https://erp.dosco.vn/api/v1
        NEXT_PUBLIC_ASSET_BASE: https://erp.dosco.vn
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  yunatt-sync:
    build:
      context: ./backend
      dockerfile: Dockerfile.yunatt
    profiles: ["jobs"]
    env_file:
      - ./backend/.env
      - ./backend/yunatt.env

volumes:
  postgres_data:
