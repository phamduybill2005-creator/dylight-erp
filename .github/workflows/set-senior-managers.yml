name: Chuan hoa Quan ly cap cao (Son/Lam/Binh)

# Xoa "quan ly ben tren" cua SON/LAM/BINH -> ho la dau nhanh (Quan ly cap cao).
# Idempotent, an toan (chi dung 3 email co dinh).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - backend/scripts/set_senior_managers_once.py

concurrency:
  group: set-senior-managers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg2
        run: python -m pip install --upgrade pip psycopg2-binary
      - name: Set senior managers
        working-directory: backend
        env:
          PYTHONIOENCODING: 'utf-8'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/set_senior_managers_once.py
