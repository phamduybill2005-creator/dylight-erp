# ============================================================================
# RENDER BLUEPRINT — DỰNG TẤT CẢ TRONG 1 LẦN BẤM, 1 TÀI KHOẢN, MIỄN PHÍ.
#
# Cách dùng:
#   1) Đẩy mã nguồn lên GitHub.
#   2) Vào https://render.com -> New -> Blueprint -> chọn repo này -> Apply.
#      Render tự tạo: CSDL Postgres + Backend + Frontend, và tự nối DATABASE_URL.
#   3) Vào service "dosco-erp-api" -> tab Shell -> chạy 1 lần:  python -m app.seed
#   4) Mở URL của "dosco-erp-web" để đăng nhập.  (Đổi ngay mật khẩu demo.)
#
# Lưu ý: Render đặt URL theo tên service -> đã điền sẵn bên dưới. Nếu Render cấp
# URL khác (do tên đã có người dùng), sửa lại 3 giá trị URL cho khớp rồi redeploy.
# ============================================================================

databases:
  - name: dosco-erp-db
    plan: free
    databaseName: dylight
    user: dylight

services:
  # ---------- BACKEND (FastAPI, Docker) ----------
  - type: web
    name: dosco-erp-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL          # DB ĐÃ CHUYỂN SANG NEON (bền, không hết hạn 90 ngày).
        sync: false                # Đặt chuỗi kết nối Neon trong Render Dashboard, KHÔNG commit secret.
                                   # (DB cũ dosco-erp-db trên Render không còn dùng — có thể xóa sau.)
      - key: SECRET_KEY            # tự sinh chuỗi ngẫu nhiên an toàn
        generateValue: true
      - key: ATTENDANCE_API_KEY    # tự sinh key cho máy chấm công
        generateValue: true
      # AI đọc hóa đơn thật (GPT-4o Vision). Đặt OPENAI_API_KEY trong Dashboard.
      # Nếu chưa có key -> ô tiền để TRỐNG cho kế toán nhập tay (KHÔNG bịa số).
      - key: OCR_PROVIDER
        value: openai
      - key: OPENAI_API_KEY      # ĐẶT trong Render Dashboard (sk-...), KHÔNG commit vào repo.
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: DEBUG                 # PROD: tắt debug + bắt buộc SECRET_KEY thật (chặn khóa mặc định)
        value: "false"
      - key: AUTO_SEED             # PROD: TẮT tự nạp dữ liệu mẫu (chống backdoor tài khoản demo 123456)
        value: "false"
      - key: FRONTEND_ORIGINS      # origin của frontend (sửa nếu Render cấp URL khác)
        value: https://dosco-erp-web.onrender.com
      # --- Đồng bộ chấm công Yunatt ---
      # TẮT lịch trong app: việc cào Playwright/Chromium chuyển sang GitHub Actions
      # (.github/workflows/yunatt-sync.yml, 20:00 VN) -> backend KHÔNG cần Chromium,
      # build nhẹ + không chạy đồng bộ 2 lần. Banner "lần đồng bộ gần nhất" vẫn hiện
      # (đọc YunattSyncLog mà Action ghi vào DB).
      - key: YUNATT_ENABLED
        value: "false"

  # ---------- FRONTEND (Next.js) ----------
  - type: web
    name: dosco-erp-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Giới hạn RAM heap của Node khi build (gói free 512MB) -> tránh "next build"
      # bị OOM-kill trên Render. Bản build ở máy dev nhiều RAM nên không lộ lỗi này.
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      # Trỏ tới backend ở trên (sửa nếu Render cấp URL khác). Next "nướng" lúc build.
      - key: NEXT_PUBLIC_API_BASE
        value: https://dosco-erp-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_ASSET_BASE
        value: https://dosco-erp-api.onrender.com
