<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%">
  <!-- Icon: stylized D bracket -->
  <g transform="translate(8, 8)">
    <!-- Top black bar -->
    <rect x="0" y="0" width="68" height="18" rx="2" fill="#111111"/>
    <!-- Bottom black bar -->
    <rect x="0" y="56" width="68" height="18" rx="2" fill="#111111"/>
    <!-- Blue middle bar (shorter) -->
    <rect x="0" y="24" width="38" height="26" rx="2" fill="#2255AA"/>
    <!-- Right vertical connector (black) -->
    <rect x="54" y="18" width="14" height="38" fill="#111111"/>
  </g>

  <!-- DOSCO text -->
  <text
    x="100"
    y="66"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', 'Oswald', sans-serif"
    font-weight="900"
    font-size="68"
    letter-spacing="-1"
    fill="#111111"
  >DOSCO</text>

  <!-- OUTSOURCE SERVICE -->
  <text
    x="102"
    y="92"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-weight="600"
    font-size="14"
    letter-spacing="5.5"
    fill="#2255AA"
  >OUTSOURCE SERVICE</text>
</svg>
